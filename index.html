<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gielinor</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gielinor">
<meta name="theme-color" content="#d4af37">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="Gielinor">
<meta property="og:image" content="og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="x-banner.jpg">

<style>
:root {
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --chat-h: 104px; --cell: 44px; --map: 118px;
  --rs-bg: rgba(62, 53, 41, 0.94); --rs-edge: #2b2419; --rs-light: #5c5141; --rs-text: #ff981f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Times New Roman', Georgia, serif;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }
button { font-family: inherit; color: #ffe8b0; background: #4a3f30; border: 1px solid var(--rs-edge); border-radius: 4px;
  box-shadow: inset 0 1px 0 #6d604c; padding: 4px 6px; font-size: 12px; cursor: pointer; touch-action: manipulation; }
button:active { background: #3a3125; }
button:disabled { opacity: 0.45; }

/* ---------- Top-left action text ---------- */
#status { position: fixed; top: calc(6px + var(--st)); left: calc(8px + var(--sl)); color: #fff; font-size: 14px;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; pointer-events: none; z-index: 5; max-width: 55vw; }
#status small { color: #ddd; }

/* ---------- Minimap and orbs ---------- */
#minimapWrap { position: fixed; top: calc(6px + var(--st)); right: calc(6px + var(--sr)); display: flex; gap: 4px; z-index: 6; align-items: flex-start; }
#minimap { position: relative; width: var(--map); height: var(--map); border-radius: 50%; border: 3px solid #4a3f30;
  box-shadow: 0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.5); background: #000; }
#minimap canvas { width: 100%; height: 100%; border-radius: 50%; display: block; cursor: crosshair; }
#compass { position: absolute; top: -4px; left: -4px; width: 28px; height: 28px; border-radius: 50%; background: #2b2419;
  border: 2px solid #8a7a5a; color: #ff3030; font: bold 13px sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#orbs { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.orb { --fill: 100%; width: 46px; height: 30px; border-radius: 15px; border: 2px solid #2b2419; color: #fff; font: bold 12px sans-serif;
  display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 3px; text-shadow: 1px 1px 0 #000;
  background: linear-gradient(to right, #8a1a1a var(--fill), #2a1a1a var(--fill)); cursor: pointer; }
.orb .orb-ico { font-size: 13px; }
.orb.low { animation: pulse 0.8s infinite alternate; }
#runOrb { background: linear-gradient(to right, #6a6a20 var(--fill), #2a2a1a var(--fill)); }
#runOrb.on { background: linear-gradient(to right, #c8a020 var(--fill), #2a2a1a var(--fill)); border-color: #ffd700; }
@keyframes pulse { to { filter: brightness(1.6); } }

/* ---------- XP drops & level up ---------- */
#xpdrops { position: fixed; top: calc(40px + var(--st)); right: calc(var(--map) + 66px + var(--sr)); display: flex; flex-direction: column;
  align-items: flex-end; pointer-events: none; z-index: 6; }
.xpdrop { color: #fff; font: bold 13px sans-serif; text-shadow: 1px 1px 0 #000; animation: xpup 1.7s ease-out forwards; white-space: nowrap; }
@keyframes xpup { 0% { transform: translateY(20px); opacity: 0; } 15% { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
#levelup { display: none; position: fixed; top: 22%; left: 50%; transform: translateX(-50%); width: min(340px, 90vw); z-index: 20;
  background: var(--rs-bg); border: 2px solid #d4af37; border-radius: 6px; color: #ffe8b0; padding: 10px 12px; font-size: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,.6); display: none; gap: 10px; align-items: center; }
#levelup b { color: var(--rs-text); }
#levelup .lu-icon { font-size: 30px; float: left; margin-right: 10px; }
#levelup.pop { animation: pop 0.35s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(0.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

/* ---------- Chat box ---------- */
#chat { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--chat-h) + var(--sb)); padding: 0 calc(4px + var(--sr)) var(--sb) calc(4px + var(--sl));
  background: rgba(30, 25, 18, 0.72); border-top: 2px solid var(--rs-light); z-index: 4; display: flex; flex-direction: column; pointer-events: auto; }
#chatLines { flex: 1; overflow-y: auto; font-size: 12px; line-height: 1.3; padding: 3px 2px; touch-action: pan-y; -webkit-user-select: text; user-select: text; }
#chatTabs { display: flex; gap: 2px; padding: 2px 0 3px; }
#chatTabs button { flex: 1; padding: 3px 0; font-size: 11px; }
#chatTabs button.on { color: #fff; background: #6a5a40; }
#chatTabs button[data-f="toggle"] { flex: 0 0 30px; }
#chat.collapsed { height: calc(48px + var(--sb)); }
.c-game { color: #fff; } .c-warn { color: #ffd84a; } .c-examine { color: #b8e0ff; }
.c-combat { color: #ff8a7a; } .c-skill { color: #8aff8a; } .c-loot { color: #ffc040; }

/* ---------- Side panel ---------- */
#sidePanel { position: fixed; right: calc(4px + var(--sr)); bottom: calc(var(--chat-h) + var(--sb) + 4px); z-index: 7;
  display: flex; flex-direction: column; background: var(--rs-bg); border: 2px solid var(--rs-edge); border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.5); color: #ffe8b0; font-size: 12px; width: calc(var(--cell) * 4 + 16px); }
#tabContent { padding: 6px; overflow-y: auto; max-height: calc(100vh - var(--chat-h) - var(--sb) - var(--st) - var(--map) - 70px); touch-action: pan-y; }
#sidePanel.collapsed #tabContent { display: none; }
#tabBar { display: flex; border-top: 1px solid var(--rs-edge); }
#tabBar button { flex: 1; font-size: 17px; padding: 5px 0; border-radius: 0; border: 0; border-right: 1px solid var(--rs-edge); background: #3a3125; box-shadow: none; }
#tabBar button:last-child { border-right: 0; }
#tabBar button.on { background: #7a2a1a; }
.tab-head { display: flex; justify-content: space-between; align-items: baseline; color: var(--rs-text); margin-bottom: 4px; gap: 6px; }
.tab-head span { color: #ffe8b0; font-size: 11px; white-space: nowrap; }
.gold { color: #ffd700; }
.hint { color: #b0a080; font-size: 10px; margin-top: 4px; text-align: center; }
.invgrid { display: grid; grid-template-columns: repeat(4, var(--cell)); grid-auto-rows: var(--cell); gap: 0; }
.slot { position: relative; border: 1px solid rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; }
.slot.item { cursor: pointer; }
.slot.item:active { filter: brightness(1.4); }
.slot .ico { font-size: calc(var(--cell) * 0.5); line-height: 1; margin-top: -6px; }
.slot .ico.ghost { opacity: 0.25; margin: 0; }
.slot .qty { position: absolute; top: 1px; left: 3px; color: #ffff00; font: bold 10px sans-serif; text-shadow: 1px 1px 0 #000; }
.slot .nm { position: absolute; bottom: 1px; left: 1px; right: 1px; font: 8px sans-serif; color: #eee; text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 0 #000; }
.slot .price { position: absolute; top: 1px; right: 3px; color: #ffd700; font: bold 9px sans-serif; text-shadow: 1px 1px 0 #000; }
.skillgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.skill { position: relative; background: #2b2419; border: 1px solid #000; border-radius: 3px; padding: 5px 4px 7px; display: flex; justify-content: space-between;
  align-items: center; cursor: pointer; font-size: 13px; }
.skill b { color: #ffff00; }
.skill i { position: absolute; left: 0; bottom: 0; height: 3px; background: #2fbf2f; }
.skill.sel { border-color: #ffd700; }
.skilldetail { margin-top: 6px; background: #2b2419; border: 1px solid #000; padding: 6px; border-radius: 3px; line-height: 1.4; }
.bar { height: 6px; background: #5a1a1a; margin-top: 4px; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: #2fbf2f; }
.styles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
.style { display: flex; flex-direction: column; padding: 6px 2px; }
.style small { font-size: 9px; color: #c0b090; }
.style.on { background: #7a2a1a; color: #fff; }
.toggle { display: block; width: 100%; margin-top: 4px; padding: 7px; text-align: left; }
.toggle.on { color: #8aff8a; }
.equipgrid { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-auto-rows: var(--cell); gap: 6px; justify-content: center; margin: 4px 0; }
.equipgrid .slot { background: #2b2419; border-color: #000; }
.equipgrid .slot.na { opacity: 0.5; }
.bonuses { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 11px; margin-top: 4px; }
.bonuses b { color: #ffff00; float: right; }
.craftlist { display: flex; flex-direction: column; gap: 3px; }
.craftskill { color: var(--rs-text); margin-top: 4px; }
.recipe { display: flex; gap: 4px; align-items: center; background: #2b2419; border: 1px solid #000; border-radius: 3px; padding: 3px; opacity: 0.75; }
.recipe.ok { opacity: 1; border-color: #4a6a2a; }
.recipe .rname { flex: 1; font-size: 11px; }
.recipe small { font-size: 9px; }
.recipe .rbtn { display: flex; gap: 2px; }
.recipe .rbtn button { padding: 5px 6px; }
.have { color: #8aff8a; } .need { color: #ff7a6a; } .lvl { color: #c0b090; font-size: 10px; }
.savebtns { display: flex; gap: 4px; margin-bottom: 4px; }
.savebtns button { flex: 1; padding: 7px 2px; }
.help { margin-top: 8px; font-size: 10px; color: #c0b090; line-height: 1.4; }

/* ---------- Bank & shop window ---------- */
#window { position: fixed; z-index: 8; top: calc(6px + var(--st)); left: calc(6px + var(--sl)); right: calc(6px + var(--sr));
  max-height: 40vh; flex-direction: column; background: var(--rs-bg); border: 2px solid var(--rs-edge); border-radius: 6px;
  color: #ffe8b0; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.6); }
.win-head { display: flex; align-items: center; gap: 8px; color: var(--rs-text); }
.win-head b { flex: 1; }
.win-head .close { padding: 4px 10px; }
.qtybar { display: flex; gap: 3px; align-items: center; margin: 4px 0; font-size: 11px; }
.qtybar button { padding: 4px 9px; }
.qtybar button.on { background: #7a2a1a; color: #fff; }
.bankgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); grid-auto-rows: var(--cell); overflow-y: auto; flex: 1; min-height: var(--cell); touch-action: pan-y; }
.win-foot { display: flex; gap: 4px; margin-top: 4px; }
.win-foot button { flex: 1; padding: 7px 2px; }

/* ---------- Options menu, tap marker, overlays ---------- */
#ctxMenu { display: none; position: fixed; z-index: 30; background: #5d5447; border: 1px solid #000; min-width: 150px; font-size: 14px; color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,.6); }
.ctx-title { background: #000; color: #5d5447; padding: 2px 6px; font-size: 13px; }
.ctx-opt { padding: 7px 8px; white-space: nowrap; cursor: pointer; border-top: 1px solid rgba(0,0,0,.15); }
.ctx-opt:hover, .ctx-opt:active { background: #7a6e5c; }
#tapMarker { position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; z-index: 9; opacity: 0; }
#tapMarker::before, #tapMarker::after { content: ''; position: absolute; left: 7px; top: 0; width: 4px; height: 18px; background: #ffff00; border: 1px solid #000; }
#tapMarker::before { transform: rotate(45deg); } #tapMarker::after { transform: rotate(-45deg); }
#tapMarker.red::before, #tapMarker.red::after { background: #ff2020; }
#tapMarker.show { animation: tapx 0.45s ease-out forwards; }
@keyframes tapx { 0% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(0.6); } }
#overlays { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.splat { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50% 50% 45% 45%; color: #fff; font: bold 13px sans-serif;
  display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 0 #000; border: 1px solid #000; will-change: transform; }
.splat.hit { background: radial-gradient(circle at 40% 35%, #ff4a3a, #a80000); }
.splat.miss { background: radial-gradient(circle at 40% 35%, #5a8aff, #1a3aa0); }
.hpbar { position: absolute; left: 0; top: 0; width: 40px; height: 6px; background: #d00000; border: 1px solid #000; will-change: transform; }
.hpbar i { display: block; height: 100%; background: #00d000; }

/* ---------- Optional D-pad ---------- */
#dpad { display: none; position: fixed; left: calc(10px + var(--sl)); bottom: calc(var(--chat-h) + var(--sb) + 12px); z-index: 6;
  grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 3px; }
#dpad button { font-size: 18px; opacity: 0.85; }

/* ---------- Landscape phone ---------- */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --chat-h: 82px; --cell: 34px; --map: 92px; }
  #sidePanel { top: calc(4px + var(--st)); bottom: 4px; flex-direction: row; width: auto; }
  #tabContent { width: calc(var(--cell) * 4 + 14px); max-height: none; }
  #tabBar { flex-direction: column; border-top: 0; border-left: 1px solid var(--rs-edge); }
  #tabBar button { flex: 1; padding: 0 8px; border-right: 0; border-bottom: 1px solid var(--rs-edge); font-size: 16px; }
  #sidePanel.collapsed { bottom: auto; }
  #sidePanel.collapsed #tabBar button { padding: 7px 8px; }
  #minimapWrap { right: calc(var(--cell) * 4 + 66px + var(--sr)); }
  #xpdrops { right: calc(var(--cell) * 4 + var(--map) + 126px + var(--sr)); top: calc(10px + var(--st)); }
  #chat { right: auto; width: min(52vw, 440px); border-right: 2px solid var(--rs-light); border-top-right-radius: 6px; }
  #chat.collapsed { height: calc(46px + var(--sb)); }
  #window { right: calc(var(--cell) * 4 + 66px + var(--sr)); max-height: none; bottom: 6px; }
  .slot .nm { display: none; }
  .slot .ico { margin-top: 0; }
  #levelup { top: 12%; }
}

/* ---------- Desktop / tablet ---------- */
@media (min-width: 900px) and (min-height: 600px) {
  :root { --chat-h: 150px; --cell: 50px; --map: 150px; }
  #chat { right: auto; width: 520px; border-right: 2px solid var(--rs-light); border-top-right-radius: 6px; }
  #sidePanel { bottom: 8px; right: calc(8px + var(--sr)); }
  #tabContent { max-height: calc(100vh - var(--map) - 70px); }
  #window { left: 50%; right: auto; width: 440px; transform: translateX(-60%); top: 80px; max-height: 60vh; }
  #status { font-size: 16px; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="status"></div>
<div id="xpdrops"></div>
<div id="levelup"></div>
<div id="chat"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
