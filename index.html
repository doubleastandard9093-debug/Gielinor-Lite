<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Times New Roman', serif; touch-action: none; }
#log {
  position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
  background: rgba(0,0,0,0.75); color: #ffd700; padding: 4px;
  font-size: 11px; overflow-y: auto; border-top: 2px solid #555;
}
button#interactBtn {
  position: absolute; bottom: 80px; right: 10px; padding: 14px 20px;
  background: #4a4a4a; color: #fff; border: 1px solid #888; border-radius: 8px;
  font-size: 16px; pointer-events: auto; z-index: 10;
}
@media (min-width: 700px) {
  #log { right: 260px; }
  button#interactBtn { right: 270px; bottom: 90px; }
}
</style>
<script type="importmap">

  }
